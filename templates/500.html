<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='favicon.ico') }}">
<title>500 - Server Error | Nexus Flow</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#070b16;color:#f8fafc;font-family:'Plus Jakarta Sans','Inter',system-ui,sans-serif;padding:24px;position:relative;overflow:hidden}
body::before{content:"";position:absolute;width:700px;height:700px;background:radial-gradient(circle at 30% 20%, rgba(37,99,235,0.18), transparent 60%),radial-gradient(circle at 80% 80%, rgba(239,68,68,0.12), transparent 60%);top:-120px;left:50%;transform:translateX(-50%);pointer-events:none}
.wrap{width:100%;max-width:520px;background:rgba(15,23,42,0.85);border:1px solid rgba(255,255,255,0.07);border-radius:24px;padding:42px 36px 36px;text-align:center;backdrop-filter:blur(16px);box-shadow:0 24px 64px rgba(0,0,0,0.45),0 1px 0 rgba(255,255,255,0.04) inset;position:relative}
.badge{display:inline-flex;align-items:center;gap:8px;padding:7px 14px;border-radius:999px;background:rgba(239,68,68,0.12);border:1px solid rgba(239,68,68,0.22);color:#fca5a5;font-size:12px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;margin-bottom:18px}
.badge-dot{width:7px;height:7px;border-radius:50%;background:#ef4444;box-shadow:0 0 10px rgba(239,68,68,0.6)}
.code{font-size:84px;font-weight:800;line-height:1;letter-spacing:-0.05em;background:linear-gradient(135deg, #f87171 0%, #ef4444 55%, #dc2626 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:10px}
.title{font-size:24px;font-weight:700;color:#f8fafc;margin-bottom:10px;letter-spacing:-0.02em}
.desc{font-size:14.5px;line-height:1.6;color:#94a3b8;margin-bottom:28px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-width:164px;padding:13px 24px;border-radius:999px;background:linear-gradient(135deg, #06b6d4 0%, #3b82f6 55%, #2563eb 100%);color:#fff;font-size:14px;font-weight:700;text-decoration:none;box-shadow:0 10px 24px rgba(37,99,235,0.28),0 1px 0 rgba(255,255,255,0.15) inset;transition:transform 0.15s ease,box-shadow 0.15s ease}
.btn:hover{transform:translateY(-1px);box-shadow:0 16px 32px rgba(37,99,235,0.35),0 1px 0 rgba(255,255,255,0.15) inset}
.btn:active{transform:translateY(0)}
.meta{margin-top:22px;font-size:12px;color:#475569;letter-spacing:0.04em}
@media(max-width:480px){.wrap{padding:34px 22px 28px;border-radius:20px}.code{font-size:68px}.title{font-size:20px}}
</style>
</head>
<body>
  <div class="wrap">
    <div class="badge"><span class="badge-dot"></span> Nexus Flow &bull; System</div>
    <div class="code">500</div>
    <div class="title">Server Error</div>
    <p class="desc">Something went wrong on our side. Please try again later.</p>
    <a href="/" class="btn">Return Home</a>
    <div class="meta">Error code: 500 &middot; Nexus Flow AI Website Builder</div>
  </div>
</body>
</html>
