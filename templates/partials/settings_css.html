<link rel="stylesheet" href="{{ url_for('static', filename='css/pages.css') }}">
<style>
    .settings-container { display: flex; gap: 20px; }
    .settings-sidebar { width: 260px; flex-shrink: 0; }
    .settings-content { flex: 1; min-width: 0; }
    .tab-pane { display: none; }
    .tab-pane.active { display: block; }
    .tab-btn { display: flex; align-items: center; gap: 10px; width: 100%; padding: 12px 16px; background: none; border: none; color: var(--page-text-secondary); font-size: 0.9rem; font-weight: 600; cursor: pointer; border-radius: var(--page-radius-sm); transition: var(--page-transition); font-family: inherit; text-align: left; }
    .tab-btn:hover { background: var(--accent-glow-soft); color: var(--page-text); }
    .tab-btn.active { background: var(--page-gradient); color: #fff; box-shadow: 0 4px 14px var(--page-accent-glow); }
    .tab-btn.danger-tab-btn { color: #ef4444; }
    .tab-btn.danger-tab-btn:hover { background: rgba(239,68,68,0.1); }
    .tab-btn.danger-tab-btn.active { background: linear-gradient(135deg, #ef4444, #dc2626); color: #fff; }
    .pane-header { margin-bottom: 20px; padding-bottom: 14px; border-bottom: 1px solid var(--page-border); }
    .pane-header h2 { margin: 0 0 4px 0; font-size: 1.2rem; color: var(--page-text); }
    .pane-header p { margin: 0; font-size: 0.85rem; color: var(--page-muted); }
    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; margin-bottom: 6px; font-size: 0.85rem; font-weight: 600; color: var(--page-text-secondary); }
    .form-group input, .form-group textarea, .form-group select { width: 100%; border: 1px solid var(--page-border); border-radius: var(--page-radius-sm); background: rgba(0,0,0,0.3); color: var(--page-text); padding: 10px 14px; font: inherit; font-size: 0.9rem; transition: var(--page-transition); font-family: inherit; }
    .form-group input:focus, .form-group textarea:focus, .form-group select:focus { outline: none; border-color: var(--page-accent); box-shadow: 0 0 0 3px rgba(var(--accent-rgb), 0.1); }
    .form-actions { padding-top: 14px; border-top: 1px solid var(--page-border); }
    .btn-save { display: inline-flex; align-items: center; gap: 8px; padding: 12px 24px; background: var(--page-gradient); color: #fff; border: none; border-radius: var(--page-radius-sm); font-weight: 700; font-size: 0.9rem; cursor: pointer; transition: var(--page-transition); font-family: inherit; box-shadow: 0 4px 14px var(--page-accent-glow); }
    .btn-save:hover { transform: translateY(-2px); box-shadow: 0 8px 20px var(--page-accent-glow); }
    .radio-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; }
    .radio-card { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 16px 12px; background: rgba(0,0,0,0.2); border: 1px solid var(--page-border); border-radius: var(--page-radius-sm); cursor: pointer; transition: var(--page-transition); }
    .radio-card:hover { border-color: var(--page-accent); }
    .radio-card.selected { border-color: var(--page-accent); background: var(--accent-glow-soft); }
    .radio-card input { display: none; }
    .radio-card i { font-size: 1.5rem; color: var(--page-accent); }
    .radio-card span { font-size: 0.8rem; font-weight: 600; color: var(--page-text-secondary); text-align: center; }
    .color-swatch { width: 30px; height: 30px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.18); display: inline-block; flex-shrink: 0; }
    .swatch-blue { background: #3b82f6; }
    .swatch-purple { background: #8b5cf6; }
    .swatch-green { background: #22c55e; }
    .swatch-red { background: #ef4444; }
    .swatch-custom { background: var(--custom-accent, #3b82f6); }
    .color-picker-wrapper { display: flex; align-items: center; gap: 12px; }
    .color-picker-wrapper input[type="color"] { width: 60px; height: 40px; padding: 4px; border: 1px solid var(--page-border); border-radius: var(--page-radius-sm); background: transparent; cursor: pointer; }
    .color-code { font-size: 0.9rem; color: var(--page-text); font-weight: 600; }
    .switch-group { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 14px 16px; background: rgba(0,0,0,0.2); border: 1px solid var(--page-border); border-radius: var(--page-radius-sm); margin-bottom: 10px; }
    .switch-info { display: flex; align-items: center; gap: 12px; }
    .switch-info i { font-size: 1.2rem; color: var(--page-accent); }
    .switch-info h4 { margin: 0; font-size: 0.9rem; color: var(--page-text); }
    .switch-info p { margin: 2px 0 0 0; font-size: 0.8rem; color: var(--page-muted); }
    .toggle-switch { position: relative; display: inline-block; width: 48px; height: 24px; }
    .toggle-switch input { opacity: 0; width: 0; height: 0; }
    .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background: rgba(255,255,255,0.1); border: 1px solid var(--page-border); border-radius: 24px; transition: var(--page-transition); }
    .slider:before { position: absolute; content: ""; height: 18px; width: 18px; left: 2px; bottom: 2px; background: var(--page-text); border-radius: 50%; transition: var(--page-transition); }
    .toggle-switch input:checked + .slider { background: var(--page-accent); border-color: var(--page-accent); }
    .toggle-switch input:checked + .slider:before { transform: translateX(24px); background: #fff; }
    .danger-card { display: flex; justify-content: space-between; align-items: center; gap: 16px; padding: 20px; background: rgba(239,68,68,0.06); border: 1px solid rgba(239,68,68,0.3); border-radius: var(--page-radius); flex-wrap: wrap; }
    .danger-info h3 { margin: 0 0 6px 0; font-size: 1rem; color: #ef4444; }
    .danger-info p { margin: 0; font-size: 0.85rem; color: var(--page-text-secondary); }
    .btn-danger-outline { display: inline-flex; align-items: center; gap: 8px; padding: 12px 20px; background: rgba(239,68,68,0.12); border: 1px solid rgba(239,68,68,0.4); color: #ef4444; border-radius: var(--page-radius-sm); font-weight: 700; font-size: 0.85rem; cursor: pointer; transition: var(--page-transition); font-family: inherit; }
    .btn-danger-outline:hover { background: #ef4444; color: #fff; }
    .alert { padding: 14px 18px; border-radius: var(--page-radius-sm); margin-bottom: 16px; font-size: 0.9rem; font-weight: 600; }
    .alert-success { background: rgba(34,197,94,0.12); border: 1px solid rgba(34,197,94,0.3); color: #22c55e; }
    .alert-danger { background: rgba(239,68,68,0.12); border: 1px solid rgba(239,68,68,0.3); color: #ef4444; }
    .password-input-wrapper { position: relative; }
    .password-input-wrapper input { padding-right: 40px; }
    .toggle-pwd { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); color: var(--page-muted); cursor: pointer; }
    @media (max-width: 768px) {
        .settings-container { flex-direction: column; }
        .settings-sidebar { width: 100%; }
        .settings-content { width: 100%; }
    }
</style>
