<!DOCTYPE html>
<html lang="en" data-theme-color="{{ theme_color }}" data-theme-value="{{ theme_color_value }}" data-theme-mode="{{ theme_mode }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='favicon.ico') }}">
    <title>Login | Nexus Flow AI</title>

    <!-- Google Fonts -->
            <link rel="stylesheet" href="{{ url_for('static', filename='vendor/fonts/fonts.css') }}">
<!-- Font Awesome Icons -->
    <link rel="stylesheet" href="{{ url_for('static', filename='vendor/fontawesome/css/all.min.css') }}">
    
    <!-- Global Theme System -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/theme.css') }}">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">

    <!-- Early Theme Script (Prevents Flickering) -->
    <script src="{{ url_for('static', filename='js/theme.js') }}"></script>
</head>
<body>

    <!-- Ambient Background Lighting -->
    <div class="bg-lighting-blur lighting-1"></div>
    <div class="bg-lighting-blur lighting-2"></div>

    <div class="login-wrapper">
        <div class="login-card-glass">
            
            <!-- Brand Header -->
            <div class="login-brand">
                <div class="logo-wrapper">
                    <img src="{{ url_for('static', filename='images/logo.png') }}" alt="Nexus Flow Logo" class="login-logo" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
                    <div class="logo-fallback-icon" style="display:none;"><i class="fa-solid fa-wand-magic-sparkles"></i></div>
                </div>
                <h1>NEXUS FLOW</h1>
                <p class="subtitle">AI Website Builder Platform</p>
            </div>

            <!-- Error Alert Banner -->
            {% if error %}
            <div class="error-message">
                <i class="fa-solid fa-circle-exclamation"></i>
                <span>{{ error }}</span>
            </div>
            {% endif %}
            
            <!-- Login Form -->
            <form action="{{ url_for('login') }}" method="POST" autocomplete="off" class="login-form" id="loginForm">

                <!-- Email Field -->
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <div class="input-input-wrapper">
                        <i class="fa-solid fa-envelope input-icon"></i>
                        <input type="email" id="email" name="email" placeholder="name@company.com" autocomplete="off" required>
                    </div>
                </div>

                <!-- Password Field (Masked by default, single eye icon) -->
                <div class="form-group">
                    <div class="label-row">
                        <label for="password">Password</label>
                    </div>
                    <div class="input-input-wrapper password-container">
                        <i class="fa-solid fa-lock input-icon"></i>
                        <input type="password" id="password" name="password" placeholder="Enter your password" autocomplete="new-password" required>
                        <i class="fa-solid fa-eye eye-icon" id="togglePassword" title="Show password" role="button" tabindex="0"></i>
                    </div>
                </div>

                <!-- Submit Button -->
                <button type="submit" class="login-page-btn">
                    <span>Login</span>
                    <i class="fa-solid fa-arrow-right"></i>
                </button>

                <!-- Footer / Register Link -->
                <div class="register-link">
                    Don't have an account?
                    <a href="{{ url_for('register') }}">Register</a>
                </div>

            </form>
        </div>
    </div>

    <!-- Script Files -->
    <script src="{{ url_for('static', filename='js/login.js') }}"></script>
</body>
</html>
